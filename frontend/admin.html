<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="products.html">Products</a> |
  <a href="/">Home</a>
  <button onclick="logout()">Logout</button>
</nav>
<hr>

<section class="admin-actions">
  <div class="card">
    <h3>Create Category</h3>
    <input id="newCatName" type="text" placeholder="Category Name">
    <button onclick="createCategory()">Create Category</button>
  </div>

  <div class="card">
    <h3>Create Product</h3>
    <input id="newProdName" type="text" placeholder="Product Name">
    <input id="newProdPrice" type="number" placeholder="Price">
    <input id="newProdCatId" type="text" placeholder="Category ID (from list below)">
    <button onclick="createProduct()">Create Product</button>
  </div>
</section>
<hr>

<p id="currentUser"></p>

<h2>Products</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="products"></tbody>
</table>




<hr>

<h2>Reference IDs (Admin)</h2>

<h3>Categories</h3>
<ul id="adminCategories"></ul>

<h3>Products</h3>
<ul id="adminProducts"></ul>

<h3>Reviews</h3>
<ul id="adminReviews"></ul>


<script src="app.js"></script>



</body>
</html>
